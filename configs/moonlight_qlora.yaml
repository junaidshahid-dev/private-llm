# Moonlight-16B-A3B QLoRA — tuned for a FREE 16GB T4 (Kaggle / Colab).
#
# Every value here is chosen for a constraint, not copied from a tutorial. The comments say
# which constraint, so you know what is safe to change when you move to a bigger GPU.

# Global seed for data shuffling, model init and the trainer. Pinned explicitly rather than
# defaulted in code, so every run manifest records the exact value that produced the adapter.
seed: 20260813

model:
  # 16B total / 3B active MoE, DeepSeek-V3 architecture, plain MIT licence.
  name: moonshotai/Moonlight-16B-A3B-Instruct
  trust_remote_code: true          # DeepSeek-V3 arch ships modelling code with the repo
  max_seq_len: 1024                # T4 has ~4.7GB spare after 4-bit weights. 2048 OOMs.

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true  # ~0.4GB saved, free
  # fp16 NOT bf16: T4 is Turing (compute 7.5) and has no bfloat16 support.
  # On an Ampere GPU (A6000/A100) change this to bfloat16 - it is more stable.
  bnb_4bit_compute_dtype: float16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  # VERIFIED against model.safetensors.index.json on 2026-08-13, not copied from a Llama recipe.
  #
  # This model uses Multi-head Latent Attention (DeepSeek-V3). There is NO k_proj and NO v_proj.
  # The real attention linears are:
  #     self_attn.q_proj                 (present because q_lora_rank is null)
  #     self_attn.kv_a_proj_with_mqa     MLA down-projection, replaces k_proj/v_proj
  #     self_attn.kv_b_proj              MLA up-projection
  #     self_attn.o_proj
  # Targeting [q_proj, k_proj, v_proj, o_proj] - the standard Llama recipe - would silently
  # attach adapters to only two of the four, or raise "target modules not found".
  target_modules: [q_proj, kv_a_proj_with_mqa, kv_b_proj, o_proj]
  # MoE expert MLPs are deliberately NOT targeted. Layers 1-26 each hold 64 routed experts plus
  # 2 shared (first_k_dense_replace=1, so layer 0 is dense). With 6 experts active per token,
  # adapters on experts train on a fraction of the data each and add thousands of modules for
  # little gain. Revisit only if attention-only underfits.

training:
  output_dir: checkpoints/moonlight-qlora-v1
  # Round 1 (experiment-003) used 3 epochs on 315 short examples and overfit into a terse,
  # denial-flavoured style — catastrophic forgetting of math and instruction-following. Round 2
  # uses 1 epoch AND a broader dataset (worked-solution math, varied instruction constraints,
  # some longer answers) so the fix is not epoch count alone.
  num_train_epochs: 1
  per_device_train_batch_size: 1   # 16GB. This is not negotiable on a T4.
  gradient_accumulation_steps: 16  # effective batch 16
  learning_rate: 2.0e-4            # standard LoRA LR; full fine-tune would be ~100x lower
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0                # LoRA adapters are small; decay mostly just hurts
  max_grad_norm: 0.3
  gradient_checkpointing: true     # trades ~30% speed for the VRAM that makes this fit at all
  optim: paged_adamw_8bit          # paged: survives the VRAM spikes that kill T4 runs
  fp16: true
  bf16: false

  # Kaggle kills the session at 9 hours, Colab at 12. Training WILL be interrupted; that is the
  # normal case, not the failure case. Checkpoint often enough that an interruption costs
  # minutes, not hours.
  save_steps: 50
  save_total_limit: 3              # free-tier disk is small
  eval_steps: 50
  logging_steps: 10
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  resume_from_checkpoint: auto     # our runner resolves the latest checkpoint itself

data:
  train_file: data/train/train.jsonl
  eval_file: data/validation/validation.jsonl
  # Moonlight-Instruct expects a chat template; prepare_dataset.py applies the tokenizer's own
  # rather than hand-rolling one, so this stays correct if the model is swapped.
  use_chat_template: true

eval:
  benchmark_file: evaluation/benchmark.jsonl
  max_new_tokens: 512
  temperature: 0.0                 # deterministic for comparability. NEVER benchmark at temp>0.
  top_p: 1.0
