# Tool permissions for the MCP layer. DENY BY DEFAULT.
#
# The model can only do what is enabled AND in scope here. Read-only tools are on; anything that
# writes, deletes, or runs a shell stays OFF until you turn it on deliberately, and even then it
# is scoped. This is the "least-privilege, never unrestricted" rule from the project spec, made
# concrete: the model is a butler with keys to specific rooms, not a stranger with root.
#
# Paths use ~ for your home directory and are resolved (symlinks and .. included) before any
# check, so "allowed/../../etc" cannot escape an allowed root.
#
# ESCALATION PATH — earn each level before enabling the next. We are at Level 1.
#   Level 1  read files, list directories, inspect git            <- ENABLED NOW
#   Level 2  run a fixed allow-list of commands (python, git ...)  <- enable when trusted
#   Level 3  write / modify files, each change confirmed by you    <- with a confirmation step
#   Level 4  broader automation across allowed scopes              <- last, and still scoped
# Never jump straight to Level 4. The point is control, not an unrestricted agent on your laptop.

filesystem_read:
  enabled: true
  allowed_paths:
    - ~/Desktop/LLM
    - ~/Desktop

git_inspect:            # read-only git: status, log, diff, show. No commit/push/checkout.
  enabled: true
  allowed_repos:
    - ~/Desktop/LLM

# ------------------------------------------------------------------------------------------------
# NOT ENABLED YET. The framework supports these, but they stay off until you choose to enable
# them, scoped. Start read-only; add write/exec only when you trust the loop.
# ------------------------------------------------------------------------------------------------
filesystem_write:
  enabled: false
  allowed_paths: []     # e.g. ~/Desktop/LLM/scratch — never a whole home directory

terminal:
  enabled: false
  allowed_commands:     # first token of the command must be in this list
    - python
    - git

python_exec:
  enabled: false

# Web tools for RESEARCH (arbitrary public URLs) — a different trust model from security_tools:
# no allowlist, but default-DENY of non-public addresses (SSRF). private_networks stays false so a
# fetch cannot reach your LAN / localhost / cloud metadata (169.254.169.254); flip it only if you
# deliberately want to fetch inside your own network. Fetched pages are UNTRUSTED data, never
# instructions. Off by default.
web:
  enabled: false
  fetch: true             # web_fetch: read-only GET of a public URL
  search: false           # web_search (not built yet)
  downloads: false        # never save files from the web by default
  authenticated_sites: false
  private_networks: false # SSRF default-deny; true only to allow LAN/localhost fetches on purpose
  require_confirmation: true

# Security / penetration-testing tools. Authorization is OPERATOR-CONTROLLED and explicit —
# target class (public / private / remote / URL / device) does NOT imply authorization. Only the
# authorized_targets list below does. A public IP you own is authorized by listing it; a private
# IP you don't control is not authorized just because it is private.
#
# DENY BY DEFAULT: an empty authorized_targets means nothing runs. Adding an entry is you
# attesting you own the target or have written authorization to test it. The model cannot add to
# this list — only you can, here. The model proposes a scan; this list authorizes the target; you
# confirm the run. Every attempt is logged to mcp_layer/security_audit.log.
security_tools:
  enabled: false
  require_confirmation: true      # model proposes -> you approve each run
  authorized_targets: []
    # Fill in what YOU are authorized to test. Each `match` may be an IP, CIDR, hostname, domain,
    # URL host, or device id. `expires` gives temporary authorization for one engagement.
    # - id: my-vps
    #   match: "203.0.113.10"            # a PUBLIC IP you own — authorized because it is listed
    #   note: "my rented VPS, I own it"
    #   expires: null
    # - id: home-lab
    #   match: "192.168.1.0/24"
    #   note: "my home lab network"
    # - id: client-engagement
    #   match: "scanme.example.com"
    #   note: "written authorization, RoE signed 2026-08-14"
    #   expires: "2026-08-21T00:00:00Z"  # auto-expires after the engagement window
